# Local backing services. Env names match prod (ARCH §12, §13).
name: digital-campus

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: pg-init
        target: /docker-entrypoint-initdb.d/10-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: campus
      MINIO_ROOT_PASSWORD: campus-secret
      # MinIO has no per-bucket CORS; this is the server-wide allow-list.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the `campus` bucket, then exits 0.
  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 campus campus-secret &&
             mc mb --ignore-existing local/campus"
    restart: "no"

configs:
  pg-init:
    content: |
      CREATE DATABASE campus_test;

volumes:
  pgdata:
  miniodata:
